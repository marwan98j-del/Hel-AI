[theme]
base = "dark"
primaryColor = "#7C5CFC"
backgroundColor = "#0B0D12"
secondaryBackgroundColor = "#11151D"
textColor = "#F5F7FA"
linkColor = "#A997FF"
codeBackgroundColor = "#10141C"
font = "Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
baseFontSize = 15
baseRadius = "12px"
buttonRadius = "10px"
borderColor = "#292E38"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0D1016"
secondaryBackgroundColor = "#151A23"
textColor = "#A7B0BE"
primaryColor = "#7C5CFC"
borderColor = "#20252E"
