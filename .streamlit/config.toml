[theme]
base = "dark"
primaryColor = "#F4B740"
backgroundColor = "#0E1014"
secondaryBackgroundColor = "#171A21"
textColor = "#F3F1EC"
linkColor = "#F4B740"
codeBackgroundColor = "#12151A"
# Geist, Bricolage Grotesque and Vazirmatn are loaded from Google Fonts by
# helai_ui.inject_global_styles; Kurdish and Arabic switch to Vazirmatn.
font = "Geist, Segoe UI, system-ui, sans-serif"
baseFontSize = 15
baseRadius = "14px"
buttonRadius = "12px"
borderColor = "#252A33"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0B0D10"
secondaryBackgroundColor = "#12151A"
textColor = "#B3B7C1"
primaryColor = "#F4B740"
borderColor = "#1F232B"

[client]
# Hide Deploy and the developer menu from users.
toolbarMode = "minimal"
# Never show tracebacks or exception text to visitors; details stay in the
# server log.
showErrorDetails = "none"
