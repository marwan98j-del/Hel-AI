[theme]
base = "dark"
# Saffron is Streamlit's accent too (checkboxes, focus, selected options);
# helai_ui keeps chips as outlines and checkbox ticks dark on the fill.
primaryColor = "#F4B740"
backgroundColor = "#0E1014"
secondaryBackgroundColor = "#171A21"
textColor = "#F3F1EC"
linkColor = "#F4B740"
codeBackgroundColor = "#12151A"
# Inter and Vazirmatn are loaded from Google Fonts by
# helai_ui.inject_global_styles; Kurdish and Arabic switch to Vazirmatn.
font = "Inter, Segoe UI, system-ui, sans-serif"
baseFontSize = 16
baseRadius = "24px"
buttonRadius = "24px"
borderColor = "#252A33"
showWidgetBorder = true

[client]
# Hide Deploy and the developer menu from users.
toolbarMode = "minimal"
# Never show tracebacks or exception text to visitors; details stay in the
# server log.
showErrorDetails = "none"

[server]
# Listen on this computer only. The Cloudflare tunnel connects to
# localhost, so other devices on the network can't bypass it.
address = "localhost"
